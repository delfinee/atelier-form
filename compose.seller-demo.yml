name: atelier-seller-demo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: atelier_form
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run launch_seller.py to create the private .env first}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - seller_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier_form"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  seller_demo_pgdata:
