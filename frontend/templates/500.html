{% load i18n %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% translate "Something went wrong" %}</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F7F2E9; color:#2E2A24;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; text-align:center; padding:2rem; }
  h1 { font-family:Georgia,serif; font-weight:400; font-size:2rem; margin:0 0 0.8rem; }
  p { color:#5A5348; max-width:40ch; margin:0 auto 1.6rem; }
  a { color:#2E2A24; }
</style>
</head>
<body>
  <div>
    <h1>{% translate "Something went wrong at our end." %}</h1>
    <p>{% translate "The studio has been notified. Try again in a moment, or head back to the homepage." %}</p>
    <a href="/">{% translate "Back to home" %}</a>
  </div>
</body>
</html>
