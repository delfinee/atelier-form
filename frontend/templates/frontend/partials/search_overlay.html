{% load i18n frontend_extras %}
<div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="{% translate "Search" %}">
  <div class="shell search-overlay__inner">
    <form class="search-form" action="{% url 'search' %}" method="get" role="search">
      {% icon "search" 26 %}
      <input type="search" name="q" placeholder="{% translate "Search products, makers, journal" %}" autocomplete="off"
             aria-label="{% translate "Search the site" %}" data-search-input>
      <button class="icon-btn" type="button" data-search-close aria-label="{% translate "Close search" %}">{% icon "close" %}</button>
    </form>

    <div data-search-initial>
      <div class="search-results">
        <div>
          <h4>{% translate "Popular searches" %}</h4>
          <div class="search-suggestions">
            {% for term in popular_searches %}
              <a class="chip" href="{% url 'search' %}?q={{ term|urlencode }}">{% translate term %}</a>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
    <div class="search-results" data-search-results aria-live="polite"></div>
  </div>
</div>
