{% load i18n %}
{% if recommendations %}
<section class="section--tight shell" style="padding-top:var(--section)" data-recommendations>
  <div class="section-head">
    <div>
      <p class="eyebrow">{{ recommendation_eyebrow }}</p>
      <h2>{{ recommendation_title }}</h2>
      {% if recommendation_note %}<p class="muted">{{ recommendation_note }}</p>{% endif %}
    </div>
  </div>
  <div class="grid grid--4">
    {% for product in recommendations %}
      {% include "frontend/partials/product_card.html" %}
    {% endfor %}
  </div>
</section>
{% endif %}
