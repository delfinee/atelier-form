{% load i18n frontend_extras %}
<!-- Floating Launcher Button -->
<button id="crafty-launcher" type="button" aria-label="{% translate "Open Artisan AI Concierge" %}" title="{% translate "Chat with Crafty" %}">
  <span class="crafty-launcher-pulse"></span>
  <span style="font-size:1.15rem; line-height:1">🏺</span>
  <span id="crafty-launcher-text">{% translate "Chat with Crafty" %}</span>
</button>

<!-- Slide-over Drawer Backdrop -->
<div id="crafty-backdrop"></div>

<!-- Crafty Slide-over Drawer -->
<aside id="crafty-drawer" role="dialog" aria-modal="true" aria-label="{% translate "Artisan AI Concierge" %}">
  <!-- Header -->
  <div class="crafty-head">
    <div class="crafty-profile">
      <div class="crafty-avatar">
        🏺
        <span class="crafty-online-dot"></span>
      </div>
      <div class="crafty-meta">
        <h3 id="crafty-title">Crafty · 匠心小助手</h3>
        <div class="crafty-badge">
          <span class="crafty-badge-dot" id="crafty-status-dot"></span>
          <span id="crafty-status">Gemini 3.8 Flash</span>
        </div>
      </div>
    </div>
    <div class="crafty-head-actions">
      <a class="crafty-btn-icon" href="{% url 'chat_page' %}" title="{% translate "Open full screen page" %}" aria-label="{% translate "Full page" %}">
        {% icon "zoom" 16 %}
      </a>
      <button class="crafty-btn-icon" id="crafty-lang-toggle" type="button" title="{% translate "Switch Language" %}">
        EN
      </button>
      <button class="crafty-btn-icon" id="crafty-settings-toggle" type="button" title="{% translate "Settings" %}">
        ⚙️
      </button>
      <button class="crafty-btn-icon" id="crafty-close" type="button" aria-label="{% translate "Close" %}">
        {% icon "close" 18 %}
      </button>
    </div>
  </div>

  <!-- Quick Scenario Chips -->
  <div class="crafty-chips-bar" id="crafty-chips">
    <!-- Generated dynamically by chatbot.js -->
  </div>

  <!-- Messages List -->
  <div class="crafty-messages" id="crafty-messages">
    <!-- Populated by chatbot.js -->
  </div>

  <!-- Foot Form Input -->
  <div class="crafty-foot">
    <form class="crafty-form" id="crafty-form" autocomplete="off" onsubmit="return false;">
      <textarea id="crafty-input" class="crafty-input" rows="1" placeholder="{% translate "Ask about makers, gifts, custom leather, or care..." %}"></textarea>
      <button type="submit" id="crafty-send-btn" class="crafty-send-btn" aria-label="{% translate "Send" %}" title="{% translate "Send" %}">
        {% icon "arrow-right" 16 %}
      </button>
    </form>
    <div class="crafty-foot-note">
      Crafty v1.3 · Powered by Google Gemini 3.8 Flash
    </div>
  </div>

  <!-- Settings Modal -->
  {% include "frontend/partials/crafty_settings_modal.html" %}
</aside>
