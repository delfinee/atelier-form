{% load i18n frontend_extras %}
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="{% translate "Your bag" %}">
  <div class="drawer__head">
    <h2>{% translate "Your bag" %}</h2>
    <button class="icon-btn" type="button" data-cart-close aria-label="{% translate "Close bag" %}">{% icon "close" %}</button>
  </div>
  <div class="drawer__body" data-drawer-body></div>
  <div class="drawer__foot" data-drawer-foot hidden>
    <div class="summary__row summary__row--total"><span>{% translate "Subtotal" %}</span><span data-drawer-subtotal>—</span></div>
    <p class="form-note" data-drawer-note></p>
    <a class="btn btn--block" href="{% url 'checkout' %}" style="margin-top:1rem">{% translate "Checkout" %}</a>
    <a class="btn btn--quiet btn--block" href="{% url 'cart' %}" style="margin-top:0.5rem">{% translate "View bag" %}</a>
  </div>
</aside>
